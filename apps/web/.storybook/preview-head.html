<!-- Geist Sans + Geist Mono via Google Fonts (geist/font/sans uses next/font
     under the hood, which doesn't load in @storybook/nextjs-vite). We
     reproduce the v2 typography stack here so stories render with the
     same fonts as production. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
/>
<style>
  :root {
    --font-geist-sans: "Geist", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-geist-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Monaco, monospace;
    --font-sans: var(--font-geist-sans);
    --font-mono: var(--font-geist-mono);
    --font-display: var(--font-geist-sans);
    --font-body: var(--font-geist-sans);
  }
  body {
    font-family: var(--font-geist-sans);
  }
</style>
